# GitHub Pages: a cada push na branch main o site é publicado.
# Ative em Settings > Pages > Source: "GitHub Actions".
# Atenção: Pages em repositório público é PÚBLICO. Para acesso restrito use plano Enterprise ou outra hospedagem com senha.
name: Publicar no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Montar pasta do site
        run: |
          mkdir _site
          cp -r index.html robots.txt css js data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
