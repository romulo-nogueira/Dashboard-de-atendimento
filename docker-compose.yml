# 1) copie .env.example para .env e defina as senhas
# 2) docker compose up -d --build        -> http://localhost:3000
# O banco fica no volume "opa-data": sobrevive a reinícios e a novas versões da imagem.
services:
  dashboard:
    build: .
    restart: unless-stopped
    ports: ["3000:3000"]
    env_file: .env
    volumes:
      - opa-data:/data

  # HTTPS automático (opcional). Edite o domínio no Caddyfile, aponte o DNS para o servidor
  # e rode:  docker compose --profile https up -d
  caddy:
    profiles: ["https"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [dashboard]

volumes:
  opa-data:
  caddy-data:
