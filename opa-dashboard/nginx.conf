server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript text/csv application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Robots-Tag "noindex, nofollow" always;

  # Para proteger com senha, gere o arquivo com:  htpasswd -c .htpasswd usuario
  # e descomente as duas linhas abaixo (monte o arquivo em /etc/nginx/.htpasswd).
  # auth_basic "Dashboard de Atendimentos";
  # auth_basic_user_file /etc/nginx/.htpasswd;

  # Dados: nunca em cache, para que a troca do CSV apareça na hora.
  location /data/ {
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri =404;
  }
  location ~* \.(css|js)$ {
    add_header Cache-Control "public, max-age=300" always;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
